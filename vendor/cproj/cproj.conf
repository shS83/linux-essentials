# CPROJ configuration — Bash syntax, sourced by the executable.
# Only source this file if it is under your own control.
CPROJ_ROOTS=("$HOME/Code" "/Tools")
CPROJ_MAX_DEPTH=5
CPROJ_CACHE_TTL=3600
CPROJ_PREVIEW_LINES=10

# Switch Python/uv virtual environments automatically when teleporting.
# 1 = enable (default), 0 = leave your current virtual environment untouched.
CPROJ_AUTO_VENV=1
